<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a">
<meta name="description" content="AttendX - Photo-Verified, Geofenced Attendance Tracking">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>AttendX</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <!-- Top bar -->
  <header id="topbar" class="hidden">
    <div class="brand"><img src="icons/icon.svg" alt=""><span>AttendX</span></div>
    <div class="who"><span id="who-name"></span><span id="who-role" class="badge"></span></div>
    <button id="btn-logout" class="btn ghost small" type="button">Logout</button>
  </header>

  <!-- Geo banner -->
  <div id="geo-banner" class="geo-banner hidden"></div>

  <main id="view"></main>

  <!-- Offline queue status -->
  <div id="queue-banner" class="queue-banner hidden"></div>

  <!-- Modals -->
  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <!-- Camera sheet -->
  <div id="camera-sheet" class="camera-sheet hidden">
    <video id="cam-video" playsinline muted autoplay></video>
    <canvas id="cam-canvas" class="hidden"></canvas>
    <div class="cam-hud">
      <div id="cam-timer" class="cam-timer hidden">REC 0:00</div>
      <div class="cam-hint">Hold steady — your face must be visible</div>
      <div class="cam-actions">
        <button id="cam-shutter" class="btn primary big" type="button">📷 Capture Photo</button>
        <button id="cam-clip" class="btn ghost" type="button">🎥 Record Clip</button>
        <button id="cam-cancel" class="btn danger" type="button">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Install prompt -->
  <div id="install-banner" class="install-banner hidden">
    <span>📲 Install AttendX for faster access</span>
    <button id="btn-install" class="btn primary small" type="button">Install</button>
    <button id="btn-install-dismiss" class="btn ghost small" type="button">✕</button>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/geo.js"></script>
<script src="js/camera.js"></script>
<script src="js/employee.js"></script>
<script src="js/admin.js"></script>
<script src="js/app.js"></script>
</body>
</html>
